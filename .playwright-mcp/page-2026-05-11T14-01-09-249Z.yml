            - text: "- Dispatch spec compliance reviewer subagent"
            - text: "-"
            - code [ref=e1214]: ./code-quality-reviewer-prompt.md
            - text: "- Dispatch code quality reviewer subagent"
            - text: "## Example Workflow"
            - code [ref=e1215]: "`"
            - text: "You: I'm using Subagent-Driven Development to execute this plan."
            - text: "[Read plan file once: docs/superpowers/plans/feature-plan.md]"
