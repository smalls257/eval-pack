            - text: "[Create TodoWrite with all tasks]"
            - text: "Task 1: Hook installation script"
            - text: "[Get Task 1 text and context (already extracted)]"
            - text: "[Dispatch implementation subagent with full task text + context]"
            - text: "Implementer: \"Before I begin - should the hook be installed at user or system level?\""
            - text: "You: \"User level (~/.config/superpowers/hooks/)\""
            - text: "Implementer: \"Got it. Implementing now...\""
            - text: "[Later] Implementer:"
