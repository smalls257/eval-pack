            - text: "## Advantages"
            - strong [ref=e3012]: "vs. Manual execution:"
            - text: "- Subagents follow TDD naturally"
            - text: "- Fresh context per task (no confusion)"
            - text: "- Parallel-safe (subagents don't interfere)"
            - text: "- Subagent can ask questions (before AND during work)"
            - strong [ref=e3013]: "vs. Executing Plans:"
            - text: "- Same session (no handoff)"
            - text: "- Continuous progress (no waiting)"
            - text: "- Review checkpoints automatic"
            - strong [ref=e3014]: "Efficiency gains:"
            - text: "- No file reading overhead (controller provides full text)"
            - text: "- Controller curates exactly what context is needed"
            - text: "- Subagent gets complete information upfront"
            - text: "- Questions surfaced before work begins (not after)"
            - strong [ref=e3015]: "Quality gates:"
            - text: "- Self-review catches issues before handoff"
            - text: "- Two-stage review: spec compliance, then code quality"
            - text: "- Review loops ensure fixes actually work"
            - text: "- Spec compliance prevents over/under-building"
            - text: "- Code quality ensures implementation is well-built"
            - strong [ref=e3016]: "Cost:"
            - text: "- More subagent invocations (implementer + 2 reviewers per task)"
            - text: "- Controller does more prep work (extracting all tasks upfront)"
            - text: "- Review loops add iterations"
            - text: "- But catches issues early (cheaper than debugging later)"
            - text: "## Red Flags"
            - strong [ref=e3017]: "Never:"
            - text: "- Start implementation on main/master branch without explicit user consent"
            - text: "- Skip reviews (spec compliance OR code quality)"
