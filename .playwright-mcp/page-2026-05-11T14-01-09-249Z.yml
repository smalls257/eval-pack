            - text: "## Advantages"
            - strong [ref=e1217]: "vs. Manual execution:"
            - text: "- Subagents follow TDD naturally"
            - text: "- Fresh context per task (no confusion)"
            - text: "- Parallel-safe (subagents don't interfere)"
            - text: "- Subagent can ask questions (before AND during work)"
            - strong [ref=e1218]: "vs. Executing Plans:"
            - text: "- Same session (no handoff)"
            - text: "- Continuous progress (no waiting)"
            - text: "- Review checkpoints automatic"
            - strong [ref=e1219]: "Efficiency gains:"
            - text: "- No file reading overhead (controller provides full text)"
            - text: "- Controller curates exactly what context is needed"
            - text: "- Subagent gets complete information upfront"
            - text: "- Questions surfaced before work begins (not after)"
            - strong [ref=e1220]: "Quality gates:"
            - text: "- Self-review catches issues before handoff"
            - text: "- Two-stage review: spec compliance, then code quality"
            - text: "- Review loops ensure fixes actually work"
            - text: "- Spec compliance prevents over/under-building"
            - text: "- Code quality ensures implementation is well-built"
            - strong [ref=e1221]: "Cost:"
            - text: "- More subagent invocations (implementer + 2 reviewers per task)"
            - text: "- Controller does more prep work (extracting all tasks upfront)"
            - text: "- Review loops add iterations"
            - text: "- But catches issues early (cheaper than debugging later)"
            - text: "## Red Flags"
            - strong [ref=e1222]: "Never:"
            - text: "- Start implementation on main/master branch without explicit user consent"
            - text: "- Skip reviews (spec compliance OR code quality)"
            - text: "- Proceed with unfixed issues"
            - text: "- Dispatch multiple implementation subagents in parallel (conflicts)"
            - text: "- Make subagent read plan file (provide full text instead)"
            - text: "- Skip scene-setting context (subagent needs to understand where task fits)"
            - text: "- Ignore subagent questions (answer before letting them proceed)"
            - text: "- Accept \"close enough\" on spec compliance (spec reviewer found issues = not done)"
            - text: "- Skip review loops (reviewer found issues = implementer fixes = review again)"
            - text: "- Let implementer self-review replace actual review (both are needed)"
            - text: "-"
            - strong [ref=e1223]: Start code quality review before spec compliance is ✅
            - text: (wrong order)
            - text: "- Move to next task while either review has open issues"
            - strong [ref=e1224]: "If subagent asks questions:"
            - text: "- Answer clearly and completely"
            - text: "- Provide additional context if needed"
            - text: "- Don't rush them into implementation"
            - strong [ref=e1225]: "If reviewer finds issues:"
            - text: "- Implementer (same subagent) fixes them"
            - text: "- Reviewer reviews again"
            - text: "- Repeat until approved"
            - text: "- Don't skip the re-review"
            - strong [ref=e1226]: "If subagent fails task:"
            - text: "- Dispatch fix subagent with specific instructions"
            - text: "- Don't try to fix manually (context pollution)"
