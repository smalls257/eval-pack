            - code [ref=e251]: "`"
            - strong [ref=e252]: The terminal state is invoking writing-plans.
            - text: Do NOT invoke frontend-design, mcp-builder, or any other implementation skill. The ONLY skill you invoke after brainstorming is writing-plans.
            - text: "## The Process"
            - strong [ref=e253]: "Understanding the idea:"
            - text: "- Check out the current project state first (files, docs, recent commits)"
            - text: "- Before asking detailed questions, assess scope: if the request describes multiple independent subsystems (e.g., \"build a platform with chat, file storage, billing, and analytics\"), flag this immediately. Don't spend questions refining details of a project that needs to be decomposed first."
            - text: "- If the project is too large for a single spec, help the user decompose into sub-projects: what are the independent pieces, how do they relate, what order should they be built? Then brainstorm the first sub-project through the normal design flow. Each sub-project gets its own spec → plan → implementation cycle."
            - text: "- For appropriately-scoped projects, ask questions one at a time to refine the idea"
            - text: "- Prefer multiple choice questions when possible, but open-ended is fine too"
            - text: "- Only one question per message - if a topic needs more exploration, break it into multiple questions"
            - text: "- Focus on understanding: purpose, constraints, success criteria"
            - strong [ref=e254]: "Exploring approaches:"
            - text: "- Propose 2-3 different approaches with trade-offs"
            - text: "- Present options conversationally with your recommendation and reasoning"
            - text: "- Lead with your recommended option and explain why"
            - strong [ref=e255]: "Presenting the design:"
            - text: "- Once you believe you understand what you're building, present the design"
            - text: "- Scale each section to its complexity: a few sentences if straightforward, up to 200-300 words if nuanced"
            - text: "- Ask after each section whether it looks right so far"
            - text: "- Cover: architecture, components, data flow, error handling, testing"
            - text: "- Be ready to go back and clarify if something doesn't make sense"
            - strong [ref=e256]: "Design for isolation and clarity:"
            - text: "- Break the system into smaller units that each have one clear purpose, communicate through well-defined interfaces, and can be understood and tested independently"
            - text: "- For each unit, you should be able to answer: what does it do, how do you use it, and what does it depend on?"
            - text: "- Can someone understand what a unit does without reading its internals? Can you change the internals without breaking consumers? If not, the boundaries need work."
            - text: "- Smaller, well-bounded units are also easier for you to work with - you reason better about code you can hold in context at once, and your edits are more reliable when files are focused. When a file grows large, that's often a signal that it's doing too much."
            - strong [ref=e257]: "Working in existing codebases:"
            - text: "- Explore the current structure before proposing changes. Follow existing patterns."
            - text: "- Where existing code has problems that affect the work (e.g., a file that's grown too large, unclear boundaries, tangled responsibilities), include targeted improvements as part of the design - the way a good developer improves code they're working in."
            - text: "- Don't propose unrelated refactoring. Stay focused on what serves the current goal."
            - text: "## After the Design"
            - strong [ref=e258]: "Documentation:"
            - text: "- Write the validated design (spec) to"
            - code [ref=e259]: docs/superpowers/specs/YYYY-MM-DD-<topic>-design.md
            - text: "- (User preferences for spec location override this default)"
            - text: "- Use elements-of-style:writing-clearly-and-concisely skill if available"
            - text: "- Commit the design document to git"
            - strong [ref=e260]: "Spec Self-Review:"
            - text: "After writing the spec document, look at it with fresh eyes:"
            - text: "1."
            - strong [ref=e261]: "Placeholder scan:"
            - text: Any "TBD", "TODO", incomplete sections, or vague requirements? Fix them.
            - text: "2."
            - strong [ref=e262]: "Internal consistency:"
            - text: Do any sections contradict each other? Does the architecture match the feature descriptions?
            - text: "3."
            - strong [ref=e263]: "Scope check:"
            - text: Is this focused enough for a single implementation plan, or does it need decomposition?
            - text: "4."
            - strong [ref=e264]: "Ambiguity check:"
            - text: Could any requirement be interpreted two different ways? If so, pick one and make it explicit.
            - text: Fix any issues inline. No need to re-review — just fix and move on.
            - strong [ref=e265]: "User Review Gate:"
            - text: "After the spec review loop passes, ask the user to review the written spec before proceeding:"
            - text: "> \"Spec written and committed to"
            - code [ref=e266]: <path>
            - text: . Please review it and let me know if you want to make any changes before we start writing out the implementation plan."
            - text: Wait for the user's response. If they request changes, make them and re-run the spec review loop. Only proceed once the user approves.
            - strong [ref=e267]: "Implementation:"
            - text: "- Invoke the writing-plans skill to create a detailed implementation plan"
            - text: "- Do NOT invoke any other skill. writing-plans is the next step."
            - text: "## Key Principles"
            - text: "-"
            - strong [ref=e268]: One question at a time
            - text: "- Don't overwhelm with multiple questions"
            - text: "-"
            - strong [ref=e269]: Multiple choice preferred
            - text: "- Easier to answer than open-ended when possible"
            - text: "-"
            - strong [ref=e270]: YAGNI ruthlessly
            - text: "- Remove unnecessary features from all designs"
            - text: "-"
            - strong [ref=e271]: Explore alternatives
            - text: "- Always propose 2-3 approaches before settling"
            - text: "-"
            - strong [ref=e272]: Incremental validation
            - text: "- Present design, get approval before moving on"
            - text: "-"
            - strong [ref=e273]: Be flexible
            - text: "- Go back and clarify when something doesn't make sense"
            - text: "## Visual Companion"
            - text: A browser-based companion for showing mockups, diagrams, and visual options during brainstorming. Available as a tool — not a mode. Accepting the companion means it's available for questions that benefit from visual treatment; it does NOT mean every question goes through the browser.
            - strong [ref=e274]: "Offering the companion:"
            - text: "When you anticipate that upcoming questions will involve visual content (mockups, layouts, diagrams), offer it once for consent:"
            - text: "> \"Some of what we're working on might be easier to explain if I can show it to you in a web browser. I can put together mockups, diagrams, comparisons, and other visuals as we go. This feature is still new and can be token-intensive. Want to try it? (Requires opening a local URL)\""
            - strong [ref=e275]: This offer MUST be its own message.
            - text: Do not combine it with clarifying questions, context summaries, or any other content. The message should contain ONLY the offer above and nothing else. Wait for the user's response before continuing. If they decline, proceed with text-only brainstorming.
            - strong [ref=e276]: "Per-question decision:"
            - text: "Even after the user accepts, decide FOR EACH QUESTION whether to use the browser or the terminal. The test:"
            - strong [ref=e277]: would the user understand this better by seeing it than reading it?
            - text: "-"
            - strong [ref=e278]: Use the browser
            - text: for content that IS visual — mockups, wireframes, layout comparisons, architecture diagrams, side-by-side visual designs
            - text: "-"
            - strong [ref=e279]: Use the terminal
            - text: for content that is text — requirements questions, conceptual choices, tradeoff lists, A/B/C/D text options, scope decisions
            - text: A question about a UI topic is not automatically a visual question. "What does personality mean in this context?" is a conceptual question — use the terminal. "Which wizard layout works better?" is a visual question — use the browser.
            - text: "If they agree to the companion, read the detailed guide before proceeding:"
            - code [ref=e280]: skills/brainstorming/visual-companion.md
            - text: "ARGUMENTS: Create an \"eval-pack\" plugin for Claude Code that runs when an agent finishes a task. Core problems to solve: (1) Record chat history + conversation stats (metrics, model, tokens, files changed) so devs can jump from eval pack + PR per ticket and quickly decide what high-level indicator needs drilling into. (2) Act as sanity check — failed test = failed eval pack. (3) Serve as learning tool — what could be improved in the repo and chat to reach solutions faster. Should support config for agents to auto-implement. Will be pushed to user's repo."
