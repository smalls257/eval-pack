            - text: "- \"I need to make a plugin for claude code. You can push this to my repo. This plugin is meant to be used as part of the development process, with an option for devs to set a config for agents to auto implement. Lets use superpowers to branstorm - but I want an eval pack plugin created that is meant to run when an agent finishes a task. it is meant to record the chat history, stats about the conversation (metrics, model used, tokens, files changed). I'm essentailly trying to solve a couple problems. I want developers to be able to jump from eval pack + pr for each ticket of work and quickly decide what high level indicator needs to be drilled won into. I also want this to act as a sanity check, a failed test is a failed eval pack. finally, I wan tthis to serve as a tool for devs to learn what could have been improved in both the repository, and the chat itself, to get to the solution faster\""
