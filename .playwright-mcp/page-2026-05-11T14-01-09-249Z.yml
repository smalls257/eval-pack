            - text: "## Model Selection"
            - text: Use the least powerful model that can handle each role to conserve cost and increase speed.
            - strong [ref=e2998]: Mechanical implementation tasks
            - text: "(isolated functions, clear specs, 1-2 files): use a fast, cheap model. Most implementation tasks are mechanical when the plan is well-specified."
            - strong [ref=e2999]: Integration and judgment tasks
            - text: "(multi-file coordination, pattern matching, debugging): use a standard model."
            - strong [ref=e3000]: Architecture, design, and review tasks
            - text: ": use the most capable available model."
            - strong [ref=e3001]: "Task complexity signals:"
            - text: "- Touches 1-2 files with a complete spec → cheap model"
            - text: "- Touches multiple files with integration concerns → standard model"
            - text: "- Requires design judgment or broad codebase understanding → most capable model"
            - text: "## Handling Implementer Status"
            - text: "Implementer subagents report one of four statuses. Handle each appropriately:"
            - strong [ref=e3002]: "DONE:"
            - text: Proceed to spec compliance review.
            - strong [ref=e3003]: "DONE_WITH_CONCERNS:"
            - text: The implementer completed the work but flagged doubts. Read the concerns before proceeding. If the concerns are about correctness or scope, address them before review. If they're observations (e.g., "this file is getting large"), note them and proceed to review.
            - strong [ref=e3004]: "NEEDS_CONTEXT:"
            - text: The implementer needs information that wasn't provided. Provide the missing context and re-dispatch.
            - strong [ref=e3005]: "BLOCKED:"
            - text: "The implementer cannot complete the task. Assess the blocker:"
            - text: 1. If it's a context problem, provide more context and re-dispatch with the same model
            - text: 2. If the task requires more reasoning, re-dispatch with a more capable model
            - text: 3. If the task is too large, break it into smaller pieces
            - text: 4. If the plan itself is wrong, escalate to the human
            - strong [ref=e3006]: Never
            - text: ignore an escalation or force the same model to retry without changes. If the implementer said it's stuck, something needs to change.
