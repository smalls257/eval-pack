            - text: "Base directory for this skill: /Users/jasonsmith/.claude/plugins/cache/claude-plugins-official/superpowers/5.0.7/skills/brainstorming"
            - text: "# Brainstorming Ideas Into Designs"
            - text: Help turn ideas into fully formed designs and specs through natural collaborative dialogue.
            - text: Start by understanding the current project context, then ask questions one at a time to refine the idea. Once you understand what you're building, present the design and get user approval.
            - text: <HARD-GATE>
            - text: Do NOT invoke any implementation skill, write any code, scaffold any project, or take any implementation action until you have presented a design and the user has approved it. This applies to EVERY project regardless of perceived simplicity.
            - text: </HARD-GATE>
            - text: "## Anti-Pattern: \"This Is Too Simple To Need A Design\""
            - text: Every project goes through this process. A todo list, a single-function utility, a config change — all of them. "Simple" projects are where unexamined assumptions cause the most wasted work. The design can be short (a few sentences for truly simple projects), but you MUST present it and get approval.
            - text: "## Checklist"
            - text: "You MUST create a task for each of these items and complete them in order:"
            - text: "1."
            - strong [ref=e240]: Explore project context
            - text: — check files, docs, recent commits
            - text: "2."
            - strong [ref=e241]: Offer visual companion
            - text: (if topic will involve visual questions) — this is its own message, not combined with a clarifying question. See the Visual Companion section below.
            - text: "3."
            - strong [ref=e242]: Ask clarifying questions
            - text: — one at a time, understand purpose/constraints/success criteria
            - text: "4."
            - strong [ref=e243]: Propose 2-3 approaches
            - text: — with trade-offs and your recommendation
            - text: "5."
            - strong [ref=e244]: Present design
            - text: — in sections scaled to their complexity, get user approval after each section
            - text: "6."
            - strong [ref=e245]: Write design doc
            - text: — save to
            - code [ref=e246]: docs/superpowers/specs/YYYY-MM-DD-<topic>-design.md
            - text: and commit
            - text: "7."
            - strong [ref=e247]: Spec self-review
            - text: — quick inline check for placeholders, contradictions, ambiguity, scope (see below)
            - text: "8."
            - strong [ref=e248]: User reviews written spec
            - text: — ask user to review the spec file before proceeding
            - text: "9."
            - strong [ref=e249]: Transition to implementation
            - text: — invoke writing-plans skill to create implementation plan
            - text: "## Process Flow"
            - code [ref=e250]: "`"
            - text: dot
            - text: "digraph brainstorming {"
            - text: "\"Explore project context\" [shape=box];"
            - text: "\"Visual questions ahead?\" [shape=diamond];"
